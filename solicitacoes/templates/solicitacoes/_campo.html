<div class="campo{% if field.errors %} campo--erro{% endif %}{% if field.widget_type == 'checkbox' %} campo--marcar{% endif %}">
  {% if field.widget_type == 'checkbox' %}
    <label class="marcar">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="obrig" title="obrigatório"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="ajuda">{{ field.help_text }}</p>{% endif %}
  {% for erro in field.errors %}<p class="erro">{{ erro }}</p>{% endfor %}
</div>
