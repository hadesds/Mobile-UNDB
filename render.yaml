# Blueprint do Render: backend Django (plano grátis). Banco no Supabase via DATABASE_URL.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: teia-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Mesmo entrypoint do Docker: migra, roda o seed se SEED_DEMO=1 e sobe o gunicorn.
    startCommand: sh docker/entrypoint.dev.sh gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: DATABASE_URL
        sync: false # string do "Session pooler" do Supabase (pedida na criação)
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALUNO_EMAIL_DOMINIOS
        value: aluno.undb.edu.br
      - key: SEED_DEMO
        value: "1"
      - key: SEED_SENHA
        sync: false
      # Supabase Storage (arquivos enviados). Sem isso, os uploads somem a cada deploy.
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false # https://<project-ref>.supabase.co/storage/v1/s3
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
